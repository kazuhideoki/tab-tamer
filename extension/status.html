<!doctype html><html lang="ja"><meta charset="utf-8"><title>Tab Tamer</title><link rel="stylesheet" href="style.css"><main><h1>Tab Tamer</h1><button id="copy-markdown" type="button">現在のタブをMarkdownでコピー</button><p id="copy-result" role="status" aria-live="polite"></p><p id="copy-shortcut"></p><section aria-label="自動休止"><h2>現在のタブ</h2><p id="resident-state" role="status" aria-live="polite">確認中…</p><button id="resident-toggle" type="button">常駐を切り替える</button> <button id="resident-pin" type="button">Pinに連動へ戻す</button><p>常駐オン：休止しない ／ 常駐オフ：一定時間後に休止</p></section><p id="state">読み込み中…</p><p>設定は config.toml を編集し、<code>./tab-tamer apply</code> で反映します。</p><details><summary>最近の処理</summary><pre id="logs"></pre></details></main><script type="module" src="status.js"></script></html>
